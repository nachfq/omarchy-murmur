name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 scripts/check_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/model.test.cjs
  qml:
    runs-on: ubuntu-24.04
    container: archlinux:base
    env:
      OMARCHY_PATH: /tmp/murmur-omarchy
      QT_QUICK_BACKEND: software
    steps:
      - run: pacman -Syu --noconfirm git jq python ffmpeg qt6-declarative qt6-multimedia qt6-multimedia-ffmpeg quickshell pipewire pipewire-pulse wireplumber libpulse
      - uses: actions/checkout@v4
      - name: Fetch the reference shell contract
        run: |
          git init "$OMARCHY_PATH"
          git -C "$OMARCHY_PATH" fetch --depth=1 https://github.com/basecamp/omarchy.git 6ea3215542fbb269dfe5c2be928e6144f9cb6466
          git -C "$OMARCHY_PATH" checkout --detach FETCH_HEAD
      - name: Validate manifest and QML
        run: |
          bash "$OMARCHY_PATH/bin/omarchy-plugin-validate" .
          scripts/check_qml.sh
      - name: Exercise native gestures and audio
        run: |
          useradd --create-home murmur-ci
          chown -R murmur-ci "$GITHUB_WORKSPACE"
          runuser -u murmur-ci -- python3 scripts/test_ui.py
          runuser -u murmur-ci -- env QT_SCALE_FACTOR=1.5 python3 scripts/test_ui.py
          runuser -u murmur-ci -- scripts/with_test_audio.sh sh -eu -c '
            scripts/test_service.sh
            python3 scripts/test_output.py
            scripts/test_loops.sh
          '
